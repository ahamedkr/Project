<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO LIST</title>
</head>
<style>
    body{
        text-align: center;
        margin-top: 50px;
        font-family: Arial, Helvetica, sans-serif;

    }
    .todo-container{
        width: 400px;
        margin: 0 auto;
        padding: 20px;
        box-shadow: 5px 5px 10px gray;
        border-radius: 10px;
        /* background-color: aqua; */
        
    }
    .todo-box{
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
    
    }

    input[type="text"]{
        width: 200px;
        padding: 10px;
        font-size: 16px;
        border: 2px solid black;
        border-radius: 5px;
        margin-right: 10px;

    }
    button{
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 5px 5px 5px gray;

    }
    .task-list{
        text-align: left;

    }
    .task{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid gray;

    }
    .task button{
        background-color:rgb(14, 13, 13);
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;

    }
</style>
<body>
    <div class="todo-container">
        <h3>TO DO LIST</h3>
        <div class="todo-box">
            <input type="text" id="taskinput" placeholder="cooking">
            <button onclick="addtask()">ADD</button>
        </div>
        <div class="task-list" id="tasklist"></div>
    </div>
</body>
<script>
    function addtask(){
        const input=document.getElementById("taskinput")
        const tasktext=input.value.trim()
        if(tasktext =="")return;
        const taskdiv=document.createElement('div')
        taskdiv.className='task'
        const tasklable=document.createElement('span')
        tasklable.textContent=tasktext;
        const deletbtn=document.createElement('button');
        deletbtn.innerHTML="🗑️"
        deletbtn.onclick=()=>taskdiv.remove();
        taskdiv.appendChild(tasklable);
        taskdiv.appendChild(deletbtn);
        document.getElementById('tasklist').appendChild(taskdiv);
    }
</script>
</html>
